name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Gradle
        run: |
          for u in https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip; do
            curl -fL --retry 3 --retry-delay 5 --retry-all-errors -o gradle.zip "$u" && break
          done
          unzip -q gradle.zip
      - run: ./gradle-8.7/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/*.apk
