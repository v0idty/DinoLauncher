name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Gradle
        run: |
          curl -fL --retry 8 --retry-delay 10 --retry-all-errors -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
      - run: ./gradle-8.7/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/*.apk
